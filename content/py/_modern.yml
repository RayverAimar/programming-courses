main-guard:
  mdn: library/__main__.html
  session: 19
  es:
    name: if __name__ == "__main__"
    new: |
      def principal():
          print("Informe del día")

      if __name__ == "__main__":
          principal()
    note: |
      El bloque corre solo cuando ejecutas el archivo directamente, no cuando otro lo importa. Así un módulo puede ofrecer funciones y también funcionar como programa.
  en:
    name: if __name__ == "__main__"
    new: |
      def main():
          print("Daily report")

      if __name__ == "__main__":
          main()
    note: |
      The block runs only when you run the file directly, not when another file imports it. That way a module can offer functions and also work as a program.

heapq:
  mdn: library/heapq.html
  session: 20
  es:
    name: heapq
    new: |
      import heapq
      tres_mejores = heapq.nlargest(3, ventas)
      heapq.heappush(pendientes, (distancia, casilla))
      distancia, casilla = heapq.heappop(pendientes)
    note: |
      Un *heap* da siempre el menor elemento en tiempo logarítmico, sin ordenar toda la lista. Sirve para los *k* mejores y para colas de prioridad como en Dijkstra.
  en:
    name: heapq
    new: |
      import heapq
      top_three = heapq.nlargest(3, sales)
      heapq.heappush(pending, (distance, tile))
      distance, tile = heapq.heappop(pending)
    note: |
      A *heap* always gives you the smallest item in logarithmic time, without sorting the whole list. Use it for the top *k* and for priority queues like Dijkstra's.

perf-counter:
  mdn: library/time.html#time.perf_counter
  session: 20
  es:
    name: time.perf_counter()
    old: |
      inicio = time.time()
      buscar_ruta(mapa)
      print(time.time() - inicio)
    new: |
      inicio = time.perf_counter()
      buscar_ruta(mapa)
      print(time.perf_counter() - inicio)
    note: |
      `time.time()` es la hora del reloj, que puede saltar si el sistema la ajusta, y tiene poca resolución. `perf_counter()` está hecho para medir duraciones cortas.
  en:
    name: time.perf_counter()
    old: |
      start = time.time()
      find_route(grid)
      print(time.time() - start)
    new: |
      start = time.perf_counter()
      find_route(grid)
      print(time.perf_counter() - start)
    note: |
      `time.time()` is the wall clock, which can jump if the system adjusts it, and has low resolution. `perf_counter()` is made for timing short stretches.

str-join:
  mdn: library/stdtypes.html#str.join
  session: 20
  es:
    name: '"".join()'
    old: |
      informe = ""
      for linea in lineas:
          informe += linea + "\n"
    new: |
      informe = "\n".join(lineas)
    note: |
      Cada `+=` sobre un texto puede crear uno nuevo y copiar todo lo anterior, y con miles de líneas se nota. `join` arma el texto final de una vez.
  en:
    name: '"".join()'
    old: |
      report = ""
      for line in lines:
          report += line + "\n"
    new: |
      report = "\n".join(lines)
    note: |
      Each `+=` on a string may build a new one and copy everything before it, and with thousands of lines you feel it. `join` builds the final string in one go.
