# The case files. Each case has its place (a scene), the clues pinned on it, the people on its board
# and the clues that fill in as the learner solves exercises. `by` names the exercise whose success
# reveals it; an id that doesn't exist yet stays pending. Text is { es, en }; everything else is shared.
# A session joins a case with a ```session block: `case: surquillo`. Format: docs/sql.md.

surquillo:
  title: { es: "Expediente SUR-0314 · El giroscopio de Wayra", en: "Case file SUR-0314 · Wayra's gyroscope" }
  place: mercado
  marks:
    - at: stall47
      by: sql1-caso-denuncia
      label: { es: "Puesto 47: el giroscopio de Wayra deja de responder a las 22:41.", en: "Stall 47: Wayra's gyroscope stops responding at 22:41." }
    - at: gate3
      by: sql1-mision-salidas
      label: { es: "Puerta 3: cinco salidas entre las 22:41 y las 23:30.", en: "Gate 3: five exits between 22:41 and 23:30." }
    - at: car3
      by: sql2-caso-entrevista
      label: { es: "Jr. Narciso de la Colina: un auto blanco esperaba afuera.", en: "Jr. Narciso de la Colina: a white car was waiting outside." }
    - at: cam3
      by: sql3-caso-camara
      label: { es: "CAM-SUR-03 lee la placa b7r415 a las 22:48, hora de Lima.", en: "CAM-SUR-03 reads plate b7r415 at 22:48, Lima time." }
    - at: cam1
      by: sql3-mision-camara
      label: { es: "Los autos de Lucía y Julio pasan después de las 23:10.", en: "Lucía's and Julio's cars pass after 23:10." }
    - at: street
      by: sql4-caso-llamadas
      label: { es: "22:52, ya afuera: Renzo llama a Tito Vílchez, comerciante de La Victoria.", en: "22:52, already outside: Renzo calls Tito Vílchez, a La Victoria trader." }
    - at: [124, 86]
      by: sql4-mision-culpable
      label: { es: "Rumbo a Gamarra: Tito le paga a Renzo S/ 1350 por el giroscopio.", en: "Off to Gamarra: Tito pays Renzo S/ 1350 for the gyroscope." }
  witnesses:
    - name: Carmen Ríos Llanos
      traits: { style: bun, shirt: "#3f7cc4", glasses: true }
      role: { es: "Técnica de Loop, puesto 47", en: "Loop technician, stall 47" }
    - name: Marleny Quispe Apaza
      traits: { style: cap, capColor: "#2f3a4a", shirt: "#2f3a4a" }
      role: { es: "Vigilante de noche", en: "Night guard" }
      appears_by: sql1-caso-denuncia
    - name: Wayra
      kind: robot
      traits: { broken: true }
      role: { es: "Robot de reparto, sin giroscopio", en: "Delivery robot, gyroscope missing" }
  suspects:
    - name: Renzo Huamaní Cárdenas
      traits: { style: short, shirt: "#5b6b7a", tool: true }
      role: { es: "Proveedor de repuestos electrónicos", en: "Electronic spare-parts supplier" }
      alibi: { es: "«Salí como a las once y diez y me fui directo a mi casa.»", en: "“I left at about ten past eleven and went straight home.”" }
      appears_by: sql1-mision-salidas
      culprit: true
      reveal_by: sql4-mision-culpable
    - name: Lucía Paredes Soto
      traits: { style: long, shirt: "#e07a5f" }
      role: { es: "Dueña de la juguería, puesto 12", en: "Juice bar owner, stall 12" }
      alibi: { es: "«Me quedé haciendo inventario y salí pasadas las once.»", en: "“I stayed doing the stocktake and left a bit after eleven.”" }
      appears_by: sql1-mision-salidas
      cleared_by: sql3-mision-camara
    - name: Óscar Ticona Mamani
      traits: { style: cap, capColor: "#4f9a6a", shirt: "#4f9a6a" }
      role: { es: "Limpieza", en: "Cleaner" }
      alibi: { es: "«Yo no tengo auto: el carro es la combi.»", en: "“I don't have a car: my ride is the minibus.”" }
      appears_by: sql1-mision-salidas
      cleared_by: sql2-mision-autos
    - name: Fiorella Campos Rojas
      traits: { style: bun, shirt: "#c4553f" }
      role: { es: "Proveedora de flores", en: "Flower supplier" }
      alibi: { es: "«Mi carro es rojo, pregúntele a cualquiera.»", en: "“My car is red, ask anyone.”" }
      appears_by: sql1-mision-salidas
      cleared_by: sql2-mision-autos
    - name: Julio Ccahuana Ríos
      traits: { style: curly, shirt: "#c49a3f", beard: true }
      role: { es: "Proveedor de fruta", en: "Fruit supplier" }
      alibi: { es: "«Salí cerca de las once y media, para Ate.»", en: "“I left at nearly half past eleven, for Ate.”" }
      appears_by: sql1-mision-salidas
      cleared_by: sql3-mision-camara
    - name: Tito Vílchez Arias
      traits: { style: short, hair: "#3a2a20", shirt: "#7a4f9a", glasses: true }
      role: { es: "Comerciante de Gamarra, La Victoria", en: "Gamarra trader, La Victoria" }
      alibi: { es: "No declaró: aparece en las llamadas de Renzo.", en: "No statement: he turns up in Renzo's calls." }
      appears_by: sql4-caso-llamadas
  clues:
    - by: sql1-caso-denuncia
      where: { es: "Sesión 1, el caso", en: "Session 1, the case" }
      text: { es: "La denuncia: el giroscopio dejó de responder a las 22:41 y la vigilante Marleny Quispe vio salir a alguien apurado por la Puerta 3.", en: "The report: the gyroscope stopped at 22:41 and the guard, Marleny Quispe, saw someone hurry out through Gate 3." }
    - by: sql1-mision-salidas
      where: { es: "Sesión 1, la misión", en: "Session 1, the mission" }
      text: { es: "Cinco personas salieron por la Puerta 3 entre las 22:41 y las 23:30.", en: "Five people went out through Gate 3 between 22:41 and 23:30." }
      links: [Renzo Huamaní Cárdenas, Lucía Paredes Soto, Óscar Ticona Mamani, Fiorella Campos Rojas, Julio Ccahuana Ríos]
    - by: sql2-caso-entrevista
      where: { es: "Sesión 2, el caso", en: "Session 2, the case" }
      text: { es: "Marleny: capucha, caja de herramientas, y se subió a un auto blanco.", en: "Marleny: a hood, a toolbox, and they got into a white car." }
    - by: sql2-mision-autos
      where: { es: "Sesión 2, la misión", en: "Session 2, the mission" }
      text: { es: "Siguen en pie tres: Renzo y Lucía tienen auto blanco; el de Julio no tiene color registrado (NULL), así que no se puede descartar.", en: "Three are still standing: Renzo and Lucía have white cars; Julio's has no colour on record (NULL), so he can't be ruled out." }
      links: [Renzo Huamaní Cárdenas, Lucía Paredes Soto, Julio Ccahuana Ríos]
    - by: sql3-caso-camara
      where: { es: "Sesión 3, el caso", en: "Session 3, the case" }
      text: { es: "CAM-SUR-03 guarda la hora en UTC: b7r415 pasó a las 22:48 de Lima, dos minutos después de que Renzo saliera.", en: "CAM-SUR-03 stores UTC: b7r415 passed at 22:48 Lima time, two minutes after Renzo went out." }
      links: [Renzo Huamaní Cárdenas]
    - by: sql3-mision-camara
      where: { es: "Sesión 3, la misión", en: "Session 3, the mission" }
      text: { es: "Lucía pasó a las 23:14 y Julio a las 23:23, después de lo que vio Marleny. Renzo dijo que salió a las 23:10: mintió.", en: "Lucía passed at 23:14 and Julio at 23:23, after what Marleny saw. Renzo said he left at 23:10: he lied." }
      links: [Renzo Huamaní Cárdenas]
    - by: sql4-caso-llamadas
      where: { es: "Sesión 4, el caso", en: "Session 4, the case" }
      text: { es: "Renzo y Tito Vílchez, comerciante de La Victoria, hablaron cuatro veces entre el jueves y el sábado; una, a las 22:52 del viernes.", en: "Renzo and Tito Vílchez, a La Victoria trader, spoke four times between Thursday and Saturday; once at 22:52 on Friday." }
      links: [Renzo Huamaní Cárdenas, Tito Vílchez Arias]
    - by: sql4-mision-culpable
      where: { es: "Sesión 4, la misión", en: "Session 4, the mission" }
      text: { es: "Tito le pagó a Renzo S/ 1350 en tres transferencias: el precio de un giroscopio.", en: "Tito paid Renzo S/ 1350 in three transfers: the price of a gyroscope." }
      links: [Renzo Huamaní Cárdenas, Tito Vílchez Arias]

sensores:
  title: { es: "Expediente SEN-0327 · El sabotaje de la sala de sensores", en: "Case file SEN-0327 · The sensor room sabotage" }
  place: sensores
  marks:
    - at: pad1
      by: sql9-caso-primera
      label: { es: "Pads 1 y 2: Tika y Kusi se descalibran en la calibración de las 03:00 del martes 24.", en: "Pads 1 and 2: Tika and Kusi go out of calibration at the 03:00 calibration on Tuesday 24." }
    - at: pad3
      by: sql9-caso-primera
      label: { es: "Pad 3: Pituco, dos noches después, a las 03:00 del jueves 26.", en: "Pad 3: Pituco, two nights later, at 03:00 on Thursday 26." }
    - at: door
      by: sql9-mision-ultimo
      label: { es: "Puerta: la tarjeta T-0412 entra a la 01:38 del 24 y a la 01:52 del 26.", en: "Door: card T-0412 goes in at 01:38 on the 24th and at 01:52 on the 26th." }
    - at: rack1
      by: sql10-mision-silencio
      label: { es: "Racks: los tres robots dejan de reportar 40 minutos mientras la T-0412 está adentro.", en: "Racks: the three robots stop reporting for 40 minutes while T-0412 is inside." }
    - at: monitor
      by: sql11-caso-version
      label: { es: "Monitor: los tres corren el firmware 2.6.0, una versión que nadie publicó.", en: "Monitor: all three run firmware 2.6.0, a version nobody released." }
  witnesses:
    - name: Carmen Ríos Llanos
      traits: { style: bun, shirt: "#3f7cc4", glasses: true }
      role: { es: "Dueña de Loop", en: "Owner of Loop" }
    - name: Tika
      kind: robot
      traits: { broken: true }
      role: { es: "Robot de vigilancia nocturna, choca con las paredes", en: "Night-watch robot, bumps into walls" }
    - name: Kusi
      kind: robot
      traits: { broken: true }
      role: { es: "Robot de cocina, se recalienta", en: "Kitchen robot, overheats" }
    - name: Pituco
      kind: robot
      traits: { broken: true }
      role: { es: "Robot de reparto en Barranco, se va de lado", en: "Delivery robot in Barranco, leans to one side" }
      appears_by: sql9-caso-primera
  suspects:
    - name: Wilmer Zevallos Benavides
      traits: { style: cap, capColor: "#33507a", shirt: "#33507a" }
      role: { es: "Vigilante de noche de la galería", en: "The arcade's night guard" }
      alibi: { es: "«Hago dos rondas, a medianoche y a las cuatro. A las dos estoy en la caseta.»", en: "“I do two rounds, at midnight and at four. At two I'm in the booth.”" }
      cleared_by: sql10-mision-silencio
    - name: Yesenia Choque Ugarte
      traits: { style: long, shirt: "#c4553f", earrings: true }
      role: { es: "Practicante de Loop", en: "Loop's intern" }
      alibi: { es: "«El viernes 20 actualicé los robots a la versión oficial. De noche nunca he entrado.»", en: "“On Friday 20 I updated the robots to the official version. I've never been in at night.”" }
      cleared_by: sql11-caso-version
    - name: Kiara Montes Alvarado
      traits: { style: bun, shirt: "#3fa7a7", glasses: true }
      role: { es: "Técnica de Andina Robótica", en: "Andina Robótica technician" }
      alibi: { es: "«Voy los miércoles en la tarde a calibrar a Illa. No toco los robots de Loop.»", en: "“I go on Wednesday afternoons to calibrate Illa. I don't touch Loop's robots.”" }
      cleared_by: sql9-mision-ultimo
    - name: Gonzalo Pumacayo Tello
      traits: { style: short, shirt: "#6b4fa0", glasses: true, hood: "#3a3550" }
      role: { es: "Exprogramador del firmware de Loop", en: "Loop's former firmware programmer" }
      alibi: { es: "«Mi tarjeta no abre nada desde febrero. Esas noches estuve en mi casa, en Surco.»", en: "“My card hasn't opened anything since February. Those nights I was at home, in Surco.”" }
      appears_by: sql10-mision-silencio
      culprit: true
      reveal_by: sql11-mision-culpable
  clues:
    - by: sql9-caso-primera
      where: { es: "Sesión 9, el caso", en: "Session 9, the case" }
      text: { es: "Tika y Kusi se descalibran a las 03:00 del martes 24; Pituco, a las 03:00 del jueves 26. Chasqui y Quilla, nunca.", en: "Tika and Kusi go out of calibration at 03:00 on Tuesday 24; Pituco, at 03:00 on Thursday 26. Chasqui and Quilla, never." }
    - by: sql9-mision-ultimo
      where: { es: "Sesión 9, la misión", en: "Session 9, the mission" }
      text: { es: "Cada noche, el último en entrar antes de las 03:00 es Wilmer en su ronda de medianoche. Menos el 24 y el 26: su tarjeta vieja, la T-0412, entra a la 01:38 y a la 01:52.", en: "Every night, the last one in before 03:00 is Wilmer on his midnight round. Except the 24th and 26th: his old card, T-0412, goes in at 01:38 and 01:52." }
      links: [Wilmer Zevallos Benavides]
    - by: sql10-caso-visitas
      where: { es: "Sesión 10, el caso", en: "Session 10, the case" }
      text: { es: "Las rondas de Wilmer duran de 3 a 5 minutos. Las dos visitas de la T-0412 duran 38 y 39, y Wilmer la había denunciado perdida el lunes 23.", en: "Wilmer's rounds last 3 to 5 minutes. T-0412's two visits last 38 and 39, and Wilmer had reported it lost on Monday 23." }
      links: [Wilmer Zevallos Benavides]
    - by: sql10-mision-silencio
      where: { es: "Sesión 10, la misión", en: "Session 10, the mission" }
      text: { es: "Tika, Kusi y Pituco se apagan 40 minutos justo mientras la T-0412 está adentro, y la nueva tarjeta de Wilmer hace sus rondas de siempre. Alguien más usó la tarjeta perdida.", en: "Tika, Kusi and Pituco go dark for 40 minutes exactly while T-0412 is inside, and Wilmer's new card does its usual rounds. Someone else used the lost card." }
      links: [Gonzalo Pumacayo Tello]
    - by: sql11-caso-version
      where: { es: "Sesión 11, el caso", en: "Session 11, the case" }
      text: { es: "Los robots saboteados corren el firmware 2.6.0, que no está en la lista de versiones publicadas. La actualización de Yesenia fue a la 2.5.9, la oficial.", en: "The sabotaged robots run firmware 2.6.0, which isn't in the list of released versions. Yesenia's update was to 2.5.9, the official one." }
    - by: sql11-mision-culpable
      where: { es: "Sesión 11, la misión", en: "Session 11, the mission" }
      text: { es: "La 2.6.0 la instaló el usuario gpumacayo desde el equipo LAP-07: el mismo usuario que firmó 27 versiones del firmware. Es Gonzalo Pumacayo.", en: "2.6.0 was installed by user gpumacayo from device LAP-07: the same user who signed 27 firmware versions. It's Gonzalo Pumacayo." }
      links: [Gonzalo Pumacayo Tello]

